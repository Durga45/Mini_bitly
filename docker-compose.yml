services:
  # --- TIER 3: DATABASE ---
  db:
    image: postgres:15-alpine
    container_name: mini-bitly-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # --- TIER 2: BACKEND ---
  backend:
    build: ./backend
    container_name: mini-bitly-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    restart: always

  # --- TIER 1: FRONTEND ---
  frontend:
    build: ./frontend
    container_name: mini-bitly-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

  # --- MONITORING: PROMETHEUS ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  # --- VISUALIZATION: GRAFANA ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - prometheus

volumes:
  postgres_data:
