name: 2. Build Stage

on:
  push:
    branches: [ main, master ]

jobs:
  building-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Temporary Env File
        run: |
          echo "POSTGRES_USER=${{ fromJSON(secrets.MINI_BILTY_SECRET).POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ fromJSON(secrets.MINI_BILTY_SECRET).POSTGRES_PASSWORD }}" >> .env
          echo "POSTGRES_DB=${{ fromJSON(secrets.MINI_BILTY_SECRET).POSTGRES_DB }}" >> .env
          echo "DATABASE_URL=postgresql://${{ fromJSON(secrets.MINI_BILTY_SECRET).POSTGRES_USER }}:${{ fromJSON(secrets.MINI_BILTY_SECRET).POSTGRES_PASSWORD }}@db:5432/${{ fromJSON(secrets.MINI_BILTY_SECRET).POSTGRES_DB }}" >> .env

      - name: Build with Docker Compose
        run: |
          echo "Building 3-tier mini-bilty project..."
          docker compose build

      - name: Status
        run: echo "Build completed successfully"